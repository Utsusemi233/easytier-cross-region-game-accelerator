# Reference native exit. Configure its own firewall, forwarding/NAT and DNS.
ipv4 = '10.10.10.1/24'
dhcp = false
instance_name = 'RegionExit'
listeners = ['udp://127.0.0.1:11020']
routes = ['10.10.10.0/24']

[network_identity]
network_name = 'REPLACE_WITH_PRIVATE_NETWORK_NAME'
network_secret = 'REPLACE_WITH_PRIVATE_NETWORK_SECRET'

[[proxy_network]]
cidr = '0.0.0.0/0'

[flags]
dev_name = 'etregion'
mtu = 1280
disable_encryption = false
disable_ipv6 = false
enable_exit_node = true
proxy_forward_by_system = true
disable_p2p = true
disable_udp_hole_punching = true
disable_sym_hole_punching = true
latency_first = true
private_mode = true
